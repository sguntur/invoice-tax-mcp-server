AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Invoice Tax MCP Server demo endpoint using Lambda container image and private ECR.

Parameters:
  ImageUri:
    Type: String
    Description: Private ECR image URI for the Lambda container.
  ApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional API key. Leave empty to disable API key check.
Resources:
  InvoiceTaxFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: invoice-tax-lambda-http
      PackageType: Image
      ImageUri: !Ref ImageUri
      MemorySize: 256
      Timeout: 10
      Architectures:
        - x86_64
      Environment:
        Variables:
          LOG_LEVEL: INFO
          API_KEY: !Ref ApiKey
      Events:
        CalculateTax:
          Type: HttpApi
          Properties:
            Path: /calculate-tax
            Method: POST

Outputs:
  ApiUrl:
    Description: Public API Gateway endpoint
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/calculate-tax"
