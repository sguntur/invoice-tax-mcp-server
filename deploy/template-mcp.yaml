AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: True MCP Streamable HTTP server using API Gateway, Lambda container image, and Private ECR.

Parameters:
  ImageUri:
    Type: String
    Description: Private ECR image URI for the MCP Lambda container.
  McpAllowedHosts:
    Type: String
    Default: "localhost,localhost:*,127.0.0.1,127.0.0.1:*"
  McpAllowedOrigins:
    Type: String
    Default: "http://localhost,http://localhost:*,http://127.0.0.1,http://127.0.0.1:*"
  TaxRulesS3Bucket:
    Type: String
    Default: ""
    Description: Optional S3 bucket containing tax_rules.yaml.
  TaxRulesS3Key:
    Type: String
    Default: tax_rules.yaml
    Description: S3 key for tax rules config.
  TaxRulesCacheTtlSeconds:
    Type: Number
    Default: 60
    Description: Config cache TTL in seconds.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        LOG_LEVEL: INFO
        MCP_ALLOWED_HOSTS: !Ref McpAllowedHosts
        MCP_ALLOWED_ORIGINS: !Ref McpAllowedOrigins
        TAX_RULES_S3_BUCKET: !Ref TaxRulesS3Bucket
        TAX_RULES_S3_KEY: !Ref TaxRulesS3Key
        TAX_RULES_CACHE_TTL_SECONDS: !Ref TaxRulesCacheTtlSeconds

Resources:
  InvoiceTaxMcpLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: invoice-tax-mcp-lambda-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: invoice-tax-config-s3-read-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "arn:aws:s3:::${TaxRulesS3Bucket}/${TaxRulesS3Key}"

  InvoiceTaxMcpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: invoice-tax-mcp-streamable-http
      PackageType: Image
      ImageUri: !Ref ImageUri
      Role: !GetAtt InvoiceTaxMcpLambdaExecutionRole.Arn
      Events:
        McpPost:
          Type: HttpApi
          Properties:
            Path: /mcp
            Method: POST
        McpGet:
          Type: HttpApi
          Properties:
            Path: /mcp
            Method: GET
        McpDelete:
          Type: HttpApi
          Properties:
            Path: /mcp
            Method: DELETE
        McpOptions:
          Type: HttpApi
          Properties:
            Path: /mcp
            Method: OPTIONS

Outputs:
  McpServerUrl:
    Description: MCP Streamable HTTP endpoint
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/mcp"

  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref InvoiceTaxMcpFunction

  UpdateStack:
    Description: Re-Deploy with this command
    Value: !Sub "sam deploy --template-file deploy/template-mcp.yaml --stack-name invoice-tax-mcp-server-mcp --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM --resolve-image-repos --parameter-overrides ImageUri=${ImageUri} McpAllowedHosts=${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com McpAllowedOrigins=https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com TaxRulesS3Bucket=invoice-tax-config TaxRulesS3Key=tax_rules.yaml TaxRulesCacheTtlSeconds=60"
